# Serves the built app and forwards /api to the backend container (compose service `api`).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The corridor, timetable and font files are large: compress them on the way out.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Hashed build assets and fonts never change under the same name.
    location ~* ^/(assets|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Data caches change when they are rebuilt: revalidate.
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
