[project]
name = "ft_ddos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4,<5",
    "mcp>=1.2,<2",
    "pydantic>=2,<3",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "uvicorn>=0.30,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
